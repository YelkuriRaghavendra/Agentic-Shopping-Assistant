[project]
name = "rag-service"
version = "2.0.0"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501", "B008", "N806", "N802"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]
markers = [
    "unit: no DB, no HTTP",
    "integration: requires running DB",
]

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*", "tests/*"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
